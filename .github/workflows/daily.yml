name: Denný zber

on:
  schedule:
    - cron: "17 5 * * *"   # každý deň okolo 7:17 slovenského času
  workflow_dispatch:        # umožní spustiť ručne tlačidlom

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inštalácia knižníc
        run: pip install requests beautifulsoup4

      - name: Zber dát a stavba stránky
        run: python tracker.py

      - name: Ulož ladiace údaje pri chybe
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug
          if-no-files-found: ignore

      - name: Ulož dáta do repozitára
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Denné dáta $(date +%F)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4